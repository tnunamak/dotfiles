# Stop gcr-ssh-agent.socket from claiming SSH_AUTH_SOCK.
#
# The distro elects an SSH agent by having each socket unit push its own path
# into the systemd user environment: ssh-agent.socket -> gcr-ssh-agent.socket
# -> gpg-agent-ssh.socket, last ExecStartPost wins (the ordering is declared in
# gcr-ssh-agent.socket's own comments). gcr therefore beats plain ssh-agent by
# default, even on KDE, where gcr/gnome-keyring arrived only as a dependency of
# python3-keyring, libqt6keychain1, stripe and docker-sbx.
#
# environment.d alone is NOT enough: the generator runs when the user manager
# starts, but this ExecStartPost runs afterwards at socket activation and
# overwrites it. Verified directly — restarting the socket flipped a correct
# openssh_agent value back to gcr/ssh.
#
# Clearing ExecStartPost leaves the gcr agent fully functional for anything
# that asks for it by path; it just no longer elects itself for the session.
# The pin then comes from .config/environment.d/10-ssh-auth-sock.conf.
[Socket]
ExecStartPost=
