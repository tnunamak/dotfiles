# Pin SSH_AUTH_SOCK to plain OpenSSH's socket-activated agent.
#
# Three user units can each set SSH_AUTH_SOCK, in a documented election order
# (see /usr/lib/systemd/user/gcr-ssh-agent.socket): ssh-agent.socket →
# gcr-ssh-agent.socket → gpg-agent-ssh.socket, last ExecStartPost wins. gcr
# therefore beats plain ssh-agent by default, even on KDE — gnome-keyring/gcr
# arrived here only as a dependency of python3-keyring, libqt6keychain1,
# stripe and docker-sbx, not by choice.
#
# Prefer plain ssh-agent because:
#   - gcr-ssh-agent.service is WantedBy=graphical-session-pre.target, so it
#     does not exist for SSH/TTY logins; ssh-agent.socket is not gated that way.
#   - gcr routes passphrase prompts through a GUI askpass, which hangs CLI and
#     remote logins.
#   - This host's secrets stack is KDE's ksecretd (it owns
#     org.freedesktop.secrets); gcr holding SSH keys splits the job across two
#     vendors' keyring daemons for no benefit.
#
# All keys in ~/.ssh are passphraseless, and ~/.ssh/config sets
# `AddKeysToAgent yes` under `Host *`, so this agent self-populates on first
# use with no prompt. Nothing needs to pre-load it at login.
#
# Research: ai/research/developer-environments/the-distro-arbitrates-ssh-auth-sock-*.md
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/openssh_agent
