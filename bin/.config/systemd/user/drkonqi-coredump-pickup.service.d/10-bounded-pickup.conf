# DrKonqi 6.6.4 (and upstream master as of 2026-07-24) keeps the pickup
# watcher subscribed after it has skipped every historic journal entry whose
# core has already been vacuumed.  The vendor RuntimeMaxSec then makes an
# otherwise-idle successful pickup look like a failed unit.
#
# Bound the vendor process explicitly instead.  GNU timeout returns 124 at the
# same 30-minute cutoff; DrKonqi failures that exit earlier retain their
# original non-zero status and remain visible to systemd.
[Service]
ExecStart=
ExecStart=/usr/bin/timeout --foreground --signal=TERM --kill-after=10s 30m /usr/lib/x86_64-linux-gnu/libexec/drkonqi-coredump-processor --settle-first --pickup --uid %U
RuntimeMaxSec=infinity
SuccessExitStatus=124
