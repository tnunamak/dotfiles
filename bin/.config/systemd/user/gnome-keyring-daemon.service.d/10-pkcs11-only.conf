# Infisical and other Secret Service consumers use KWallet on peregrine.
#
# Kubuntu's unit otherwise starts one GNOME Keyring process with both pkcs11
# and secrets components.  An already-running process can claim
# org.freedesktop.secrets before the per-user D-Bus activation override for
# ksecretd has a chance to run.  Keep the independent PKCS#11 provider, but
# leave Secret Service ownership to KWallet.
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-keyring-daemon --foreground --components=pkcs11 --control-directory=%t/keyring
