[Unit]
# Daisy's watchdog addresses main:daisy.  tmux-resurrect can temporarily
# rebuild two restored windows with that name, so Daisy must start only after
# its restore job completes.  Wants (rather than Requires) is intentional:
# tmux-restore is a oneshot with RemainAfterExit=no, and making Daisy require
# an inactive successful oneshot would incorrectly tear Daisy down.
After=tmux-restore.service
Wants=tmux-restore.service

[Service]
# Preserve Daisy's application-owned unit while making its tmux readiness
# contract reproducible from dotfiles.  The wrapper has bounded retries for a
# target that disappears/reappears during restore; ordinary application
# failures still reach systemd and retain the application's restart policy.
ExecStart=
ExecStart=/home/tnunamak/.local/bin/daisy-tmux-resilient-start /home/tnunamak/applications/daisy/start_service.sh
