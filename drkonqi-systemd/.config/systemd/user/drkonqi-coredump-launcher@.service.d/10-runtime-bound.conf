# Bound each crash-handler instance so a hung one cannot pin a socket slot
# forever. drkonqi-coredump-launcher.socket is Accept=yes with a hard-coded
# MaxConnections=16; once 16 instances are stuck, every later crash is refused
# ("Too many incoming connections (16), dropping connection") and goes
# unrecorded. 2026-09-09: 16 instances from the 2026-08-30 boot storm sat in
# poll() for 9 days waiting on a D-Bus reply that never came; 239 crashes were
# refused meanwhile. The vendor unit has no runtime bound (Restart=no only).
#
# 10min is ~100x the launcher's own metadata wait; a healthy run finishes in
# seconds. Expiry marks the instance failed, which is the wanted signal here
# (a real hang), unlike the pickup unit's cosmetic 30-minute expiry noted in
# ai/research/systemd/drkonqi-pickups-intentional-runtime-bound-*.md.
#
# KillMode=process: the launcher runs the drkonqi crash dialog via a blocking
# QProcess::execute, so it is the dialog's parent. The default control-group
# kill would close a dialog the user still has open; killing only the launcher
# reparents the dialog and leaves it alone.
[Service]
RuntimeMaxSec=10min
KillMode=process
