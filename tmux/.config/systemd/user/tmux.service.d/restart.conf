[Service]
# If tmux exits or is restarted unexpectedly, systemd relaunches it within
# RestartSec so tmux-restore.service can rebuild sessions from the most recent
# save. Explicit systemd stop/restart operations are handled by systemd as
# control operations; spontaneous clean exits still need recovery.
#
# The base tmux.service is generated by tmux-continuum and doesn't set
# Restart= and contains stale ExecStop paths after plugin layout changes, so we
# override here. Drop-in survives continuum regeneration.
Restart=always
RestartSec=2
TimeoutStopSec=10min

# Clear the generated ExecStop lines, then run one wrapper that logs the stop,
# saves state through the current tmux-resurrect path, and kills the server.
ExecStop=
ExecStop=/home/tnunamak/.config/tmux/scripts/tmux-service-stop.sh
