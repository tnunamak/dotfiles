[Service]
# If tmux crashes (e.g. a bad plugin hook, OOM, bug), systemd relaunches it
# within RestartSec so tmux-continuum's auto-restore can rebuild the sessions
# from the most recent save. Without this, a crash means the server stays
# dead until the user notices and logs in — in the 2026-04-21 incident the
# save pipeline stopped silently and went unnoticed for ~37 hours.
#
# The base tmux.service is generated by tmux-continuum and doesn't set
# Restart=, so we override here. Drop-in survives continuum regeneration.
Restart=on-failure
RestartSec=2
