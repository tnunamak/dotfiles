[Unit]
# tmux 3.6 creates every pane in a transient tmux-spawn-*.scope. Without an
# ordering edge, user-manager shutdown may stop those scopes before
# tmux.service runs ExecStop and saves the pane topology. Stop order is the
# inverse of start order: placing every pane scope Before=tmux.service makes
# tmux.service stop (and save) before systemd stops the pane scopes.
Before=tmux.service
