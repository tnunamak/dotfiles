# --- General ---
set -g default-terminal "tmux-256color"
# Kitty terminal capabilities (single line avoids duplication on reload)
set -g terminal-features[100] "xterm-kitty*:RGB:usstyle:clipboard:hyperlinks"
set -g mouse on
# Keep deep agent/shell scrollback without letting this long-lived, many-pane
# server grow without bound. tmux stores history in RAM; this applies to panes
# created after the option is loaded (existing pane limits cannot be resized).
set -g history-limit 500000
set -g escape-time 0          # no delay after Esc (important for nvim)
set -g focus-events on

# Bell: forward a pane bell (e.g. Claude finishing) only to a client that is
# actively VIEWING the belled window, not every client. With grouped-session
# clones (one per kitty, all sharing the same windows) the default
# `bell-action any` rings every attached client → all kitties flash the Plasma
# urgency hint at once. `current` scopes the flash to the terminal in view.
set -g monitor-bell on
set -g bell-action current
set -g visual-bell off        # let kitty own the urgency hint; no tmux overlay

set -g extended-keys on       # required for modified Enter keys in TUIs like Pi
set -g extended-keys-format csi-u
set -g set-clipboard on
set -g allow-passthrough on    # forward kitty graphics protocol for inline images

# Never destroy sessions when the client detaches. SDDM/Wayland restarts
# briefly unattach every session; destroy-unattached on would wipe them all.
set -g destroy-unattached off

# --- Prefix ---
set -g prefix C-Space         # Ctrl+Space (easier than Ctrl+b)
unbind C-b
bind C-Space send-prefix
set -g prefix2 C-a            # fallback for mobile (Termius)

# --- Splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Windows ---
bind c new-window -c "#{pane_current_path}"

# --- Reload ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# --- Status bar (minimal, Tokyo Night) ---
set -g status-position bottom
set -g status-interval 15
set -g status-style 'bg=default,fg=#a9b1d6'
set -g status-left '#{?#{session_group},#[fg=#7aa2f7]#[bold][#{session_group} group · view #S] ,#[fg=#7aa2f7]#[bold][#S] }'
set -g status-left-length 40
set -g status-right '#{?#{SSH_CONNECTION},#[fg=#f7768e]ssh ,}#[fg=#565f89]#{session_group_attached} client#{?#{>:#{session_group_attached},1},s,}'
set -g window-status-current-format '#[fg=#7aa2f7,bold]#I:#{=12:window_name}'
set -g window-status-format '#[fg=#565f89]#I:#{=12:window_name}'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Prefix+w opens a touch-friendly fzf popup over windows in this client session.
bind w run-shell "$HOME/.config/tmux/scripts/tmux-window-picker.sh"
set-hook -g after-refresh-client 'run-shell -b "$HOME/.config/tmux/scripts/tmux-window-autoname.sh"'

# --- Plugins (order matters!) ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# --- Resurrect ---
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'

# --- Continuum ---
# We keep continuum's periodic save (status-bar-triggered). We do NOT use its
# boot-time restore: continuum_restore.sh races against its own auto-save and
# against the first client attach, and silently skips restore when ps shows
# more than one tmux-named process. Restore is driven by the user systemd
# unit tmux-restore.service instead (see tmux/.config/systemd/user/).
# See CLAUDE.md and tmux-plugins/tmux-continuum issues #36, #90, #140, #155.
set -g @continuum-boot 'on'       # systemd auto-start on login (creates tmux.service)
# NOTE: @continuum-restore is forcibly set to 'on' by tmux-assistant-resurrect
# during TPM load — we override it below the TPM `run` line, same pattern
# already used for @resurrect-restore-script-path.

# --- Environment ---
# continuum-boot starts tmux before Wayland session, so WAYLAND_DISPLAY
# is missing initially. update-environment imports it when a client attaches
# (e.g., opening kitty). New panes after attach get the correct value.
# Restored panes keep stale env but Claude/Codex don't need WAYLAND_DISPLAY.
set -ga update-environment " WAYLAND_DISPLAY"

# --- Initialize TPM ---
run '~/.tmux/plugins/tpm/tpm'

# --- Fix grouped session restore (must be after TPM) ---
# tmux-assistant-resurrect sets @resurrect-hook-post-restore-all via TPM.
# We override it here to restore grouped-session presentation with select-window
# (works headlessly, unlike switch-client), then record every assistant sidecar
# entry as deferred. Layout restoration never implies assistant replay.
# Back up save files so continuum can never silently overwrite a full save
# with an empty one. Uses post-save-layout (not post-save-all, which
# tmux-assistant-resurrect uses).
set -g @resurrect-hook-post-save-layout "bash \"$HOME/.config/tmux/scripts/post-save-backup.sh\""

set -g @resurrect-hook-post-restore-all "bash \"$HOME/.config/tmux/scripts/post-restore-grouped-focus.sh\""
# A cold restore only records deferred assistants. The first real tmux client
# then consumes that one restore marker and uses explicit automatic leases to
# replay every saved entry, including panes in unattached worker sessions.
set-hook -g client-attached 'run-shell -b "$HOME/.local/bin/tmux-agent-resume attend-boot-restore"'

# Guard assistant-sessions.json against post-crash shrinkage. Wraps (and
# overrides) tmux-assistant-resurrect's own post-save-all hook. The guard
# refuses to overwrite a populated sidecar with an empty one, and rotates
# timestamped backups into ~/.tmux/resurrect/backups/. Must be set after
# TPM init because the plugin sets this hook during load.
set -g @resurrect-hook-post-save-all "bash \"$HOME/.config/tmux/scripts/save-assistant-sessions-guarded.sh\""

# Disable continuum's boot-time auto-restore (overrides tmux-assistant-resurrect,
# which unconditionally sets it to 'on' during TPM load). Restore is driven by
# tmux-restore.service instead. See CLAUDE.md for rationale.
set -g @continuum-restore 'off'
